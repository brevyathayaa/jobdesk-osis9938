<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Jobdesk Organisasi</title>
  <link rel="stylesheet" href="index.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- MODAL LOGIN -->
  <div id="login-modal" class="modal">
    <div class="modal-card">
      <div class="modal-header">
        <h2>Sistem Jobdesk</h2>
        <p>Masukkan kata sandi akun Anda untuk melanjutkan</p>
      </div>
      <div class="form-group">
        <div class="password-wrapper">
          <input type="password" id="password-input" placeholder="Kata sandi akun...">
          <button type="button" id="toggle-password" aria-label="Tampilkan password">👁️</button>
        </div>
        <button id="login-btn" class="btn btn-primary">Masuk</button>
      </div>
      <p id="login-error" class="error-msg"></p>
    </div>
  </div>

  <!-- DASHBOARD UTAMA -->
  <div id="app-container" class="app-container hidden">
    <header class="navbar">
      <div class="brand">
        <h1>Dashboard Jobdesk</h1>
        <span class="user-badge" id="user-display">Pengguna: -</span>
      </div>
      <button id="logout-btn" class="btn btn-outline">Keluar</button>
    </header>

    <main class="main-content">
      <section class="section-title">
        <h2>Pilih Divisi</h2>
        <p>Silakan pilih divisi untuk melihat atau mengambil jobdesk</p>
      </section>

      <div class="division-grid">
        <button class="div-card" data-divisi="Acara">
          <span class="div-icon">📅</span>
          <h3>Acara</h3>
        </button>
        <button class="div-card" data-divisi="Humas">
          <span class="div-icon">📢</span>
          <h3>Humas</h3>
        </button>
        <button class="div-card" data-divisi="Keamanan">
          <span class="div-icon">🛡️</span>
          <h3>Keamanan</h3>
        </button>
        <button class="div-card" data-divisi="Perlengkapan">
          <span class="div-icon">📦</span>
          <h3>Perlengkapan</h3>
        </button>
        <button class="div-card" data-divisi="Dokumentasi">
          <span class="div-icon">📷</span>
          <h3>Dokumentasi</h3>
        </button>
        <button class="div-card" data-divisi="Perlombaan">
          <span class="div-icon">🏆</span>
          <h3>Perlombaan</h3>
        </button>
        <button class="div-card filter-free" data-divisi="Free">
          <span class="div-icon">⚡</span>
          <h3>Belum Mengambil Jobdesk</h3>
        </button>
      </div>

      <!-- DETAIL DIVISI & DAFTAR ANGGOTA -->
      <section id="division-detail" class="detail-section hidden">
        <div class="detail-header">
          <div>
            <h2 id="current-division-name">Divisi: -</h2>
            <!-- DUKUNGAN TAMPILAN ANGGOTA SEDANG MENGERJAKAN -->
            <div id="active-workers-container" class="active-workers-box hidden">
              <span class="active-title">Sedang mengerjakan tugas:</span>
              <div id="active-workers-list" class="workers-chips"></div>
            </div>
          </div>
          <button id="back-btn" class="btn btn-secondary">← Kembali</button>
        </div>

        <!-- TOMBOL PINDAH DIVISI -->
        <div id="change-div-container"></div>

        <div id="members-list" class="members-grid">
          <!-- Item anggota akan muncul di sini secara otomatis -->
        </div>
      </section>
    </main>
  </div>

  <script type="module" src="index.js"></script>
</body>
</html>
